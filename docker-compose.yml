# LOCAL TESTING ONLY. Render uses render.yaml, not this file.
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      ENABLE_SELFTEST_TOOLS: "1"
      ENABLE_DOCS: "1"
      MAX_FILE_MB: "25"
      MAX_JOB_MB: "60"
      MAX_CONCURRENT_JOBS: "1"
      JOB_TTL_MIN: "45"
      JOB_TIMEOUT_SEC: "120"
      RATE_LIMIT_PER_HOUR: "30"
      OCR_MAX_PAGES: "30"
    mem_limit: 512m
    cpus: 1.0

  # Runs the test suite in a throwaway container: docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    image: python:3.12-slim-bookworm
    working_dir: /work
    volumes:
      - ./backend:/work
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: sh -c "pip install -q -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider"

services:
  - type: web
    name: pdf-toolkit-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      # Free plan (512 MB). For a 2 GB instance use MAX_FILE_MB 25, MAX_JOB_MB 60,
      # MAX_CONCURRENT_JOBS 2, JOB_TIMEOUT_SEC 120, MAX_QUEUE 20, MAX_TOTAL_JOBS 40.
      - key: MAX_FILE_MB
        value: "15"
      - key: MAX_JOB_MB
        value: "30"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: JOB_TTL_MIN
        value: "45"
      - key: JOB_TIMEOUT_SEC
        value: "180"
      - key: MAX_QUEUE
        value: "10"
      - key: MAX_TOTAL_JOBS
        value: "20"
      - key: WORKER_MEMORY_MB
        value: "1024"
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
      - key: OCR_MAX_PAGES
        value: "30"
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_SELFTEST_TOOLS
        value: "0"
      - key: ENABLE_DOCS
        value: "0"
      # Web frontend later: comma-separated origins, empty = CORS off.
      # - key: CORS_ORIGINS
      #   value: "https://your-site.example.com"
